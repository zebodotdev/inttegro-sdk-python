[tool.poetry]
name = "zebo-commerce"
version = "0.1.0"
description = "Lightweight Python SDK for the Zebo Commerce API"
authors = ["Zebo Engineering <engineering@inttegro.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "commerce", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10"

[tool.poetry.group.dev.dependencies]
coverage = "^7.6.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
